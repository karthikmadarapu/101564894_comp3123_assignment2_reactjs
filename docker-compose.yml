services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [ "mongo-data:/data/db" ]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s          # mongosh can be slow to start on a busy Docker VM
      retries: 5
      start_period: 20s
    # no ports: MongoDB is reachable only inside the Compose network

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    ports: [ "127.0.0.1:8081:8081" ]          # local machine only
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD}
    depends_on:
      mongo: { condition: service_healthy }

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env                 # MONGODB_URI, JWT_SECRET, PORT, CORS_ORIGIN
    ports: [ "5000:5000" ]
    volumes:
      - uploads:/app/uploads                 # pictures persist across rebuilds
      - ./backend/logs:/app/logs             # logs visible on the host for evidence
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    ports: [ "3000:80" ]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  mongo-data:
  uploads:
