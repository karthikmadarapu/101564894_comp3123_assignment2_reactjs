server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }   # deep links like /employees/123 work on refresh
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:5000; img-src 'self' http://localhost:5000 data: blob:; style-src 'self' 'unsafe-inline'" always;
}

