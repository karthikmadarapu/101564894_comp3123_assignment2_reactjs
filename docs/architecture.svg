<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- Host machine / browser -->
  <rect x="20" y="20" width="860" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="44" font-weight="600" fill="#0f172a">Your machine — browser</text>
  <rect x="300" y="52" width="300" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="450" y="73" text-anchor="middle" font-weight="600" fill="#1e3a8a">React app (runs in the browser)</text>
  <text x="450" y="90" text-anchor="middle" font-size="12" fill="#1e3a8a">Axios baseURL = http://localhost:5000/api/v1</text>

  <!-- Compose network -->
  <rect x="20" y="160" width="860" height="250" rx="10" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="36" y="184" font-weight="600" fill="#0f172a">Docker Compose network (service-name DNS)</text>

  <rect x="50" y="210" width="190" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="145" y="238" text-anchor="middle" font-weight="600" fill="#4c1d95">frontend</text>
  <text x="145" y="257" text-anchor="middle" font-size="12" fill="#4c1d95">nginx · static build</text>
  <text x="145" y="275" text-anchor="middle" font-size="12" fill="#4c1d95">host :3000 → :80</text>

  <rect x="355" y="210" width="190" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="450" y="238" text-anchor="middle" font-weight="600" fill="#14532d">backend</text>
  <text x="450" y="257" text-anchor="middle" font-size="12" fill="#14532d">Express API · /health</text>
  <text x="450" y="275" text-anchor="middle" font-size="12" fill="#14532d">host :5000 → :5000</text>

  <rect x="660" y="210" width="190" height="80" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="755" y="238" text-anchor="middle" font-weight="600" fill="#78350f">mongo</text>
  <text x="755" y="257" text-anchor="middle" font-size="12" fill="#78350f">MongoDB 7</text>
  <text x="755" y="275" text-anchor="middle" font-size="12" fill="#78350f">no host port</text>

  <rect x="660" y="320" width="190" height="70" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="755" y="348" text-anchor="middle" font-weight="600" fill="#7f1d1d">mongo-express</text>
  <text x="755" y="368" text-anchor="middle" font-size="12" fill="#7f1d1d">127.0.0.1:8081 · basic auth</text>

  <!-- arrows -->
  <line x1="340" y1="98" x2="160" y2="208" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="170" y="140" font-size="12" fill="#334155">GET pages (localhost:3000)</text>

  <line x1="450" y1="98" x2="450" y2="208" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="460" y="140" font-size="12" fill="#334155">API calls + JWT (localhost:5000)</text>
  <text x="460" y="155" font-size="12" fill="#334155">CORS_ORIGIN = http://localhost:3000</text>

  <line x1="545" y1="250" x2="658" y2="250" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="550" y="240" font-size="12" fill="#334155">mongodb://mongo:27017</text>

  <line x1="755" y1="320" x2="755" y2="292" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- volumes -->
  <rect x="20" y="430" width="860" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="36" y="454" font-weight="600" fill="#0f172a">Persistence</text>
  <text x="36" y="478" font-size="13" fill="#334155">volume mongo-data → mongo:/data/db   ·   volume uploads → backend:/app/uploads   ·   bind ./backend/logs → backend:/app/logs</text>
  <text x="36" y="495" font-size="12" fill="#64748b">docker compose down keeps volumes · docker compose down -v wipes them</text>
</svg>
